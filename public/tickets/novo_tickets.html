<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Criar Ticket - Sistema Modular</title>

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

    <style>
        body {
            background-color: #f1f3f4;
        }

        .sidebar {
            height: 100vh;
            background: linear-gradient(180deg, #212529, #343a40);
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            padding-top: 60px;
        }

        .sidebar a {
            color: #adb5bd;
            text-decoration: none;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background-color: #495057;
            color: white;
        }

        .sidebar i {
            margin-right: 10px;
        }

        .topbar {
            position: fixed;
            top: 0;
            left: 250px;
            right: 0;
            height: 60px;
            background-color: #ffffff;
            border-bottom: 1px solid #dee2e6;
            z-index: 1000;
            padding: 0 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .topbar h5 {
            margin: 0;
        }

        .content {
            margin-left: 250px;
            padding: 2rem;
            padding-top: 5rem;
        }

        .username-btn {
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <a href="/painel"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="/lista_tickets"><i class="bi bi-ticket"></i> Tickets</a>
        <a href="#"><i class="bi bi-folder2-open"></i> Documentos</a>
        <a href="#"><i class="bi bi-tools"></i> Manutenção</a>
        <a href="/controle_usuarios"><i class="bi bi-people"></i> Usuários</a>
        <a href="#"><i class="bi bi-gear"></i> Configurações</a>
    </div>

    <!-- Topbar -->
    <div class="topbar">
        <h5>Criar Novo Ticket</h5>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-primary username-btn">
                <i class="bi bi-person-circle"></i> Carregando...
            </button>
            <button onclick="logout()" class="btn btn-outline-danger btn-sm">Sair</button>
        </div>
    </div>

    <!-- Conteúdo -->
    <div class="content">
        <h4 class="mb-4">Novo Ticket</h4>

        <div id="alert-area"></div>

        <form id="formTicket" class="bg-white p-4 rounded shadow-sm">
            <div class="mb-3">
                <label for="titulo" class="form-label">Título</label>
                <input type="text" class="form-control" id="titulo" required>
            </div>

            <div class="mb-3">
                <label for="descricao" class="form-label">Descrição</label>
                <textarea class="form-control" id="descricao" rows="4" required></textarea>
            </div>

            <div class="mb-3">
                <label for="prioridade" class="form-label">Prioridade</label>
                <select class="form-select" id="prioridade" required>
                    <option value="Baixa">Baixa</option>
                    <option value="Média" selected>Média</option>
                    <option value="Alta">Alta</option>
                    <option value="Urgente">Urgente</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="status" class="form-label">Status</label>
                <select class="form-select" id="status" required></select>
            </div>

            <div class="mb-3">
                <label for="grupo" class="form-label">Grupo</label>
                <select class="form-select" id="grupo" required></select>
            </div>

            <button type="submit" class="btn btn-primary">Criar Ticket</button>
        </form>
    </div>

    <!-- Scripts -->
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const nomeUsuario = localStorage.getItem("usuario_nome") || "Usuário";
            document.querySelector(".username-btn").innerHTML = `<i class="bi bi-person-circle"></i> ${nomeUsuario}`;

            await carregarSelects();
        });

        async function carregarSelects() {
            const token = localStorage.getItem("token");
            /*
            * TODO: CRIAR API para obter status e grupos
            * Exemplo de chamada:
            const [statusResp, gruposResp] = await Promise.all([
                fetch("/api/status", { headers: { Authorization: `Bearer ${token}` } }),
                fetch("/api/grupos", { headers: { Authorization: `Bearer ${token}` } }),
            ]);
            */
            const [statusResp, gruposResp] = await Promise.all([
                fetch("/api/status?tipoBanco=TK", {
                    method: "GET",
                    headers: {
                        Authorization: `Bearer ${token}`,
                    },
                }),
                fetch("/api/grupo?tipoBanco=TK", {
                    method: "GET",
                    headers: {
                        Authorization: `Bearer ${token}`,
                    },
                }),

                // fetch("/api/grupos", { headers: { Authorization: `Bearer ${token}` } }),
            ]);

            const status = await statusResp.json();
            const grupos = await gruposResp.json();

            const statusSelect = document.getElementById("status");
            const grupoSelect = document.getElementById("grupo");

            status.forEach(s => {
                statusSelect.innerHTML += `<option value="${s.id_status}">${s.id_nome}</option>`;
            });

            grupos.forEach(g => {
                grupoSelect.innerHTML += `<option value="${g.Grupo_id}">${g.Grupo_nome}</option>`;
            });
        }

        document.getElementById("formTicket").addEventListener("submit", async (e) => {
            e.preventDefault();

            const token = localStorage.getItem("token");

            const ticket = {
                title: document.getElementById("titulo").value,
                description: document.getElementById("descricao").value,
                prioridade: document.getElementById("prioridade").value,
                status_id: document.getElementById("status").value,
                grupo_id: document.getElementById("grupo").value,
                criado_por_id: localStorage.getItem("usuario_id") // ID do usuário que está criando o ticket
            };

            const res = await fetch("/api/tickets", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify(ticket)
            });

            const alertArea = document.getElementById("alert-area");
            if (res.ok) {
                alertArea.innerHTML = `<div class="alert alert-success">Ticket criado com sucesso!</div>`;
                document.getElementById("formTicket").reset();
            } else {
                const error = await res.json();
                alertArea.innerHTML = `<div class="alert alert-danger">Erro: ${error.message || 'Erro ao criar ticket'}</div>`;
            }
        });

        async function logout() {
            try {
                const token = localStorage.getItem("token");
                if (!token) {
                    // Já está deslogado
                    window.location.href = "/";
                    return;
                }

                const response = await fetch("/api/autenticacao/logout", {
                    method: "POST", // ou DELETE, se quiser mais semântico
                    headers: {
                        "Content-Type": "application/json",
                        Authorization: `Bearer ${token}`,
                    },
                });

                if (response.ok) {
                    localStorage.clear();
                    window.location.href = "/"; // Redireciona para a home após logout
                } else {
                    const result = await response.json();
                    console.error("Erro no logout:", result.message);
                    alert("Erro ao sair: " + result.message);
                }
            } catch (err) {
                console.error("Erro ao tentar logout:", err);
                alert("Erro inesperado ao sair.");
            }
        }
    </script>
</body>

</html>
