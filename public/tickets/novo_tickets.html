<!doctype html>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <title>RTS IntegraX</title>

    <script>
        // Função para verificar validade do token
        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(function (c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));

                return JSON.parse(jsonPayload);
            } catch (e) {
                return null;
            }
        }

        const token = localStorage.getItem('token');

        if (!token) {
            // Token não existe, redireciona para login
            window.location.href = "/";
        } else {
            const payload = parseJwt(token);
            const now = Math.floor(Date.now() / 1000);

            if (!payload || payload.exp < now) {
                // Token expirado
                localStorage.removeItem('token');
                window.location.href = "/";
            }

            // Caso queira: 
            console.log("Token válido. Bem-vindo!");
        }
    </script>
</head>

<body>

                <div class="offcanvas-body">
                    <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">

                                data-bs-toggle="dropdown" aria-expanded="false">

                            </a>
                            <ul class="dropdown-menu dropdown-menu-dark">
                                <li><a class="dropdown-item" href="/controle_usuarios"> <i
                                            class="bi bi-person-gear"></i> Controle de Usuarios</a></li>

                                    <hr class="dropdown-divider">

                        </li>

                        </li>
                        <li class="nav-item">

                            <a class="nav-link" href="/pessoas"><i class="bi bi-people"></i> Pessoas</a>

                    </ul>
                    <form class="d-flex mt-3" role="search">
                        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                        <button class="btn btn-success" type="submit">Search</button>

        </div>

    <main class="container mt-5 pt-5">
        <div class="p-4 bg-light rounded shadow-sm">
            <div class="content">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3 class="mb-0">Novo Ticket</h3>
                    <a href="/lista_tickets" class="btn btn-secondary">
                        <i class="bi bi-arrow-return-left"></i> Return
                    </a>
                </div>
                <div id="alert-area"></div>

                <form id="formTicket" class="bg-white p-4 rounded shadow-sm">
                    <div class="mb-3">
                        <label for="titulo" class="form-label">Título</label>
                        <input type="text" class="form-control" id="titulo" required>
                    </div>

                    <div class="mb-3">
                        <label for="descricao" class="form-label">Descrição</label>
                        <textarea class="form-control" id="descricao" rows="4" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="prioridade" class="form-label">Prioridade</label>
                        <select class="form-select" id="prioridade" required>
                            <option value="Baixa">Baixa</option>
                            <option value="Média" selected>Média</option>
                            <option value="Alta">Alta</option>
                            <option value="Urgente">Urgente</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="status" class="form-label">Status</label>
                        <select class="form-select" id="status" required></select>
                    </div>

                    <div class="mb-3">
                        <label for="grupo" class="form-label">Grupo</label>
                        <select class="form-select" id="grupo" required></select>
                    </div>

                    <div class="mb-3">
                        <label for="solicitante" class="form-label">Solicitante</label>
                        <select class="form-select" id="solicitante" required></select>
                    </div>

                    <div class="mb-3">
                        <label for="url_github" class="form-label">URL GitHub</label>
                        <input type="text" class="form-control" id="url_github" required>
                    </div>


                    <button type="submit" class="btn btn-primary">Criar Ticket</button>
                </form>
            </div>
        </div>
    </main>


    <script src="bootstrap-5.3.7-dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const nomeUsuario = localStorage.getItem("usuario_nome") || "Usuário";
            document.querySelector(".username-btn").innerHTML = `<i class="bi bi-person-circle"></i> ${nomeUsuario}`;

            await carregarSelects();
        });

        async function carregarSelects() {
            const token = localStorage.getItem("token");
            /*
            * TODO: CRIAR API para obter status e grupos
            * Exemplo de chamada:
            const [statusResp, gruposResp] = await Promise.all([
                fetch("/api/status", { headers: { Authorization: `Bearer ${token}` } }),
                fetch("/api/grupos", { headers: { Authorization: `Bearer ${token}` } }),
            ]);
            */
            const [statusResp, gruposResp, peopleResp] = await Promise.all([
                fetch("/api/status?tipoBanco=TK", {
                    method: "GET",
                    headers: {
                        Authorization: `Bearer ${token}`,
                    },
                }),
                fetch("/api/grupo?tipoBanco=TK", {
                    method: "GET",
                    headers: {
                        Authorization: `Bearer ${token}`,
                    },
                }),
                fetch("/api/people", {
                    method: "GET",
                    headers: {
                        Authorization: `Bearer ${token}`,
                    },
                }),

                // fetch("/api/grupos", { headers: { Authorization: `Bearer ${token}` } }),
            ]);

            const people = await peopleResp.json();
            const status = await statusResp.json();
            const grupos = await gruposResp.json();

            const statusSelect = document.getElementById("status");
            const grupoSelect = document.getElementById("grupo");
            const solicitanteSelect = document.getElementById("solicitante");


            status.forEach(s => {
                statusSelect.innerHTML += `<option value="${s.id_status}">${s.id_nome}</option>`;
            });

            grupos.forEach(g => {
                grupoSelect.innerHTML += `<option value="${g.Grupo_id}">${g.Grupo_nome}</option>`;
            });

            people.forEach(p => {
                solicitanteSelect.innerHTML += `<option value="${p.pessoa_id}">${p.pessoa_nome}</option>`;
            });
        }

        document.getElementById("formTicket").addEventListener("submit", async (e) => {
            e.preventDefault();

            const token = localStorage.getItem("token");

            const ticket = {
                title: document.getElementById("titulo").value,
                description: document.getElementById("descricao").value,
                prioridade: document.getElementById("prioridade").value,
                status_id: document.getElementById("status").value,
                grupo_id: document.getElementById("grupo").value,
                solicitante_id: document.getElementById("solicitante").value,
                criado_por_id: localStorage.getItem("usuario_id"), // ID do usuário que está criando o ticket
                url_github: document.getElementById("url_github").value
            };

            const res = await fetch("/api/tickets", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify(ticket)
            });

            const alertArea = document.getElementById("alert-area");
            if (res.ok) {
                alertArea.innerHTML = `<div class="alert alert-success">Ticket criado com sucesso!</div>`;
                document.getElementById("formTicket").reset();
            } else {
                const error = await res.json();
                alertArea.innerHTML = `<div class="alert alert-danger">Erro: ${error.message || 'Erro ao criar ticket'}</div>`;
            }
        });

        async function logout() {
            try {
                const token = localStorage.getItem("token");
                if (!token) {
                    // Já está deslogado
                    window.location.href = "/";
                    return;
                }

                const response = await fetch("/api/autenticacao/logout", {
                    method: "POST", // ou DELETE, se quiser mais semântico
                    headers: {
                        "Content-Type": "application/json",
                        Authorization: `Bearer ${token}`,
                    },
                });

                if (response.ok) {
                    localStorage.clear();
                    window.location.href = "/"; // Redireciona para a home após logout
                } else {
                    const result = await response.json();
                    console.error("Erro no logout:", result.message);
                    alert("Erro ao sair: " + result.message);
                }
            } catch (err) {
                console.error("Erro ao tentar logout:", err);
                alert("Erro inesperado ao sair.");
            }
        }
    </script>
</body>

</html>
