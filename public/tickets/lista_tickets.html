<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tickets - Sistema Modular</title>

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

    <style>
        body {
            background-color: #f1f3f4;
        }

        .sidebar {
            height: 100vh;
            background: linear-gradient(180deg, #212529, #343a40);
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            padding-top: 60px;
        }

        .sidebar a {
            color: #adb5bd;
            text-decoration: none;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background-color: #495057;
            color: white;
        }

        .sidebar i {
            margin-right: 10px;
        }

        .topbar {
            position: fixed;
            top: 0;
            left: 250px;
            right: 0;
            height: 60px;
            background-color: #ffffff;
            border-bottom: 1px solid #dee2e6;
            z-index: 1000;
            padding: 0 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .topbar h5 {
            margin: 0;
        }

        .content {
            margin-left: 250px;
            padding: 2rem;
            padding-top: 5rem;
        }

        .card-ticket {
            border-left: 5px solid var(--status-color);
            transition: 0.2s;
        }

        .card-ticket:hover {
            transform: scale(1.01);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .badge-status {
            color: #fff;
            padding: 0.4em 0.6em;
            border-radius: 0.25rem;
        }

        .badge-prioridade {
            font-weight: bold;
        }

        .username-btn {
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <a href="/painel"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="/lista_tickets"><i class="bi bi-ticket"></i> Tickets</a>
        <a href="#"><i class="bi bi-folder2-open"></i> Documentos</a>
        <a href="#"><i class="bi bi-tools"></i> Manutenção</a>
        <a href="/controle_usuarios"><i class="bi bi-people"></i> Usuários</a>
        <a href="#"><i class="bi bi-gear"></i> Configurações</a>
        <a href="#"><i class="bi bi-bar-chart-line"></i> Relatórios</a>
    </div>

    <!-- Topbar -->
    <div class="topbar">
        <h5>Tickets - Sistema Modular</h5>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-primary username-btn">
                <i class="bi bi-person-circle"></i> Carregando...
            </button>
            <button onclick="logout()" class="btn btn-outline-danger btn-sm">Sair</button>
        </div>
    </div>

    <!-- Conteúdo -->
    <div class="content">
        <h4 class="mb-4">Visualização de Tickets</h4>
        <div class="row g-4" id="ticket-container">
            <!-- Tickets serão inseridos aqui -->
        </div>
    </div>


    <script>
        async function fetchTickets() {
            try {
                const token = localStorage.getItem("token");

                const response = await fetch('http://localhost:3000/api/tickets', {
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error("Não autorizado ou erro no servidor");
                }

                const tickets = await response.json();
                renderTickets(tickets);
            } catch (error) {
                console.error("Erro ao buscar tickets:", error);
                const container = document.getElementById("ticket-container");
                container.innerHTML = `<p class="text-danger">Erro ao carregar tickets. Verifique sua conexão ou se está logado.</p>`;
            }
        }

        function renderTickets(tickets) {
            const container = document.getElementById("ticket-container");
            container.innerHTML = "";

            tickets.forEach(ticket => {
                const card = document.createElement("div");
                card.className = "col-md-6";

                card.innerHTML = `
        <div class="card card-ticket border-0 shadow-sm" style="--status-color: ${ticket.Cor_Status}">
          <div class="card-body">
            <h5 class="card-title">${ticket.Titulo}</h5>
            <p class="card-text">${ticket.Descricao}</p>

            <div class="d-flex justify-content-between align-items-center flex-wrap">
              <span class="badge badge-prioridade bg-light text-dark">
                Prioridade: ${ticket.Prioriedade}
              </span>
              <span class="badge badge-status" style="background-color: ${ticket.Cor_Status};">
                ${ticket.Status}
              </span>
              <span class="badge bg-secondary" style="background-color: ${ticket.Cor_Grupo};">
                ${ticket.Grupo}
              </span>
            </div>

            <small class="text-muted d-block mt-2">ID: ${ticket.ID}</small>
          </div>
        </div>
      `;
                container.appendChild(card);
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            const nomeUsuario = localStorage.getItem("usuario_nome") || "Usuário";
            document.querySelector(".username-btn").innerHTML = `<i class="bi bi-person-circle"></i> ${nomeUsuario}`;

            fetchTickets();
        });
        async function logout() {
            try {
                const token = localStorage.getItem("token");
                if (!token) {
                    // Já está deslogado
                    window.location.href = "/";
                    return;
                }

                const response = await fetch("http://localhost:3000/api/autenticacao/logout", {
                    method: "POST", // ou DELETE, se quiser mais semântico
                    headers: {
                        "Content-Type": "application/json",
                        Authorization: `Bearer ${token}`,
                    },
                });

                if (response.ok) {
                    localStorage.clear();
                    window.location.href = "/"; // Redireciona para a home após logout
                } else {
                    const result = await response.json();
                    console.error("Erro no logout:", result.message);
                    alert("Erro ao sair: " + result.message);
                }
            } catch (err) {
                console.error("Erro ao tentar logout:", err);
                alert("Erro inesperado ao sair.");
            }
        }
    </script>

</body>

</html>
