<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="bootstrap-5.3.7-dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <title>RTS IntegraX</title>
    <style>
        .list-view .card-ticket {
            border-left: 5px solid var(--status-color, #ccc);
            border-radius: 0;
            margin-bottom: 0.75rem;
        }

        .list-view .card-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .list-view .card-title {
            margin: 0;
            font-size: 1rem;
        }
    </style>
    <script>
        // Função para verificar validade do token
        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(function (c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));

                return JSON.parse(jsonPayload);
            } catch (e) {
                return null;
            }
        }

        const token = localStorage.getItem('token');

        if (!token) {
            // Token não existe, redireciona para login
            window.location.href = "/";
        } else {
            const payload = parseJwt(token);
            const now = Math.floor(Date.now() / 1000);

            if (!payload || payload.exp < now) {
                // Token expirado
                localStorage.removeItem('token');
                window.location.href = "/";
            }

            // Caso queira: 
            console.log("Token válido. Bem-vindo!");
        }
    </script>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/painel">RTS IntegraX</a>
            <!-- Botão de menu -->
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#offcanvasDarkNavbar" aria-controls="offcanvasDarkNavbar"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <!-- Fim do botão de menu -->
            <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="offcanvasDarkNavbar"
                aria-labelledby="offcanvasDarkNavbarLabel">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title" id="offcanvasDarkNavbarLabel">Menu Opções</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
                        aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle username-btn" href="#" role="button"
                                data-bs-toggle="dropdown" aria-expanded="false">
                                Carregando...
                            </a>
                            <ul class="dropdown-menu dropdown-menu-dark">
                                <li><a class="dropdown-item" href="/controle_usuarios"> <i
                                            class="bi bi-person-gear"></i> Controle de Usuarios</a></li>
                                <li><a class="dropdown-item" href="#">Another action</a></li>
                                <li>
                                    <hr class="dropdown-divider">
                                </li>
                                <li><a class="dropdown-item" href="#" onclick="logout()">Sair</a></li>
                            </ul>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/painel"><i class="bi bi-speedometer2"></i> Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="/lista_tickets"><i
                                    class="bi bi-ticket"></i> Tickets</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/pessoas"><i class="bi bi-people"></i> Pessoas</a>
                        </li>
                    </ul>
                    <form class="d-flex mt-3" role="search">
                        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                        <button class="btn btn-success" type="submit">Search</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <main class="container mt-5 pt-5">
        <div class="p-4 bg-light rounded shadow-sm">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="mb-0">Visualização de Tickets</h3>
                <div>
                    <button id="btnCard" class="btn btn-outline-primary btn-sm me-2"><i class="bi bi-grid-3x3-gap"></i>
                        Cards</button>
                    <button id="btnList" class="btn btn-outline-secondary btn-sm"><i class="bi bi-list-ul"></i>
                        Lista</button>
                    <a href="/novo_tickets" class="btn btn-success ms-3"><i class="bi bi-plus-circle"></i> Novo
                        Ticket</a>
                </div>
            </div>

            <!-- Filtros + Pesquisa -->
            <div class="row g-2 mb-4">
                <div class="col-md-3">
                    <select id="filtro-prioridade" class="form-select">
                        <option value="">Todas Prioridades</option>
                        <option value="Alta">Alta</option>
                        <option value="Média">Média</option>
                        <option value="Baixa">Baixa</option>
                        <option value="Urgente">Urgente</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select id="filtro-status" class="form-select">
                        <option value="">Todos Status</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select id="filtro-grupo" class="form-select">
                        <option value="">Todos Grupos</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <input type="text" id="campo-pesquisa" class="form-control" placeholder="Pesquisar tickets...">
                </div>
            </div>

            <!-- Tickets -->
            <div id="ticket-container" class="row g-4">
                <!-- Tickets vão aqui -->
            </div>
        </div>
    </main>



    <script src="../bootstrap-5.3.7-dist/js/bootstrap.bundle.min.js"></script>
    <script>

        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(c =>
                    '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
                ).join(''));
                return JSON.parse(jsonPayload);
            } catch {
                return null;
            }
        }

        function validarToken() {
            const token = localStorage.getItem('token');
            if (!token) {
                alert("Sessão expirada ou inexistente. Faça login novamente.");
                window.location.href = "/";
                return null;
            }
            const payload = parseJwt(token);
            const now = Math.floor(Date.now() / 1000);
            if (!payload || payload.exp < now) {
                alert("Sessão expirada. Faça login novamente.");
                localStorage.clear();
                window.location.href = "/";
                return null;
            }
            return token;
        }

        let todosTickets = [];
        let modoVisualizacao = "card"; // padrão

        function aplicarFiltros() {
            const prioridade = document.getElementById("filtro-prioridade").value;
            const status = document.getElementById("filtro-status").value;
            const grupo = document.getElementById("filtro-grupo").value;
            const pesquisa = document.getElementById("campo-pesquisa").value.toLowerCase();

            let filtrados = todosTickets;

            if (prioridade) filtrados = filtrados.filter(t => t.Prioriedade === prioridade);
            if (status) filtrados = filtrados.filter(t => t.Status === status);
            if (grupo) filtrados = filtrados.filter(t => t.Grupo === grupo);
            if (pesquisa) filtrados = filtrados.filter(t => t.Titulo.toLowerCase().includes(pesquisa));

            renderTickets(filtrados);
        }

        async function fetchTickets() {
            const token = validarToken();
            if (!token) return;

            try {
                const response = await fetch('/api/tickets', {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                todosTickets = await response.json();
                preencherFiltros(todosTickets);
                renderTickets(todosTickets);
            } catch (error) {
                document.getElementById("ticket-container").innerHTML = `<p class="text-danger">Erro ao carregar tickets.</p>`;
            }
        }

        function preencherFiltros(tickets) {
            const statusSet = [...new Set(tickets.map(t => t.Status))];
            const grupoSet = [...new Set(tickets.map(t => t.Grupo))];
            const statusSelect = document.getElementById("filtro-status");
            const grupoSelect = document.getElementById("filtro-grupo");

            statusSet.forEach(s => {
                const opt = document.createElement("option");
                opt.value = s;
                opt.textContent = s;
                statusSelect.appendChild(opt);
            });
            grupoSet.forEach(g => {
                const opt = document.createElement("option");
                opt.value = g;
                opt.textContent = g;
                grupoSelect.appendChild(opt);
            });

            statusSelect.addEventListener("change", aplicarFiltros);
            grupoSelect.addEventListener("change", aplicarFiltros);
            document.getElementById("filtro-prioridade").addEventListener("change", aplicarFiltros);
            document.getElementById("campo-pesquisa").addEventListener("input", aplicarFiltros);
        }

        function renderTickets(tickets) {
            const container = document.getElementById("ticket-container");
            container.innerHTML = "";
            container.classList.toggle("list-view", modoVisualizacao === "list");

            if (!tickets.length) {
                container.innerHTML = `<p class="text-muted">Nenhum ticket encontrado.</p>`;
                return;
            }

            tickets.forEach(ticket => {
                if (modoVisualizacao === "card") {
                    container.innerHTML += `
            <div class="col-md-6">
              <div class="card card-ticket border-0 shadow-sm" style="--status-color: ${ticket.Cor_Status}">
                <div class="card-body">
                                            <!-- Botão Editar -->
                        <a href="/ticket_editar/${ticket.ID}" class="btn btn-outline-secondary btn-sm rounded-circle shadow-sm position-absolute top-0 end-0 m-2" title="Editar Ticket">
                            <i class="bi bi-pencil"></i>
                        </a>
                    
                  <h5 class="card-title"><a href="/ticket_detalhes/${ticket.ID}" class="text-decoration-none">${ticket.Titulo}</a></h5>
                  <div class="d-flex gap-2 mt-2">
                    <span class="badge bg-light text-dark">Prioridade: ${ticket.Prioriedade ?? 'N/A'}</span>
                    <span class="badge" style="background-color:${ticket.Cor_Status}">${ticket.Status}</span>
                    <span class="badge" style="background-color:${ticket.Cor_Grupo}">${ticket.Grupo}</span>
                  </div>
                  <small class="text-muted">ID: ${ticket.ID}</small>
                </div>
              </div>
            </div>`;
                } else {
                    container.innerHTML += `
            <div class="card card-ticket shadow-sm" style="--status-color:${ticket.Cor_Status}">
              <div class="card-body">
                                                            <!-- Botão Editar -->
                        <a href="/ticket_editar/${ticket.ID}" class="btn btn-outline-secondary btn-sm rounded-circle shadow-sm position-absolute top-0 end-0 m-2" title="Editar Ticket">
                            <i class="bi bi-pencil"></i>
                        </a>
                
                <div>
                  <h6 class="card-title"><a href="/ticket_detalhes/${ticket.ID}">${ticket.Titulo}</a></h6>
                  <small>ID: ${ticket.ID}</small>
                </div>
                <div>
                  <span class="badge bg-light text-dark">${ticket.Prioriedade ?? 'N/A'}</span>
                  <span class="badge" style="background-color:${ticket.Cor_Status}">${ticket.Status}</span>
                  <span class="badge" style="background-color:${ticket.Cor_Grupo}">${ticket.Grupo}</span>
                </div>
              </div>
            </div>`;
                }
            });
        }


        async function logout() {
            try {
                const token = localStorage.getItem("token");
                if (!token) {
                    // Já está deslogado
                    window.location.href = "/";
                    return;
                }

                const response = await fetch("/api/autenticacao/logout", {
                    method: "POST", // ou DELETE, se quiser mais semântico
                    headers: {
                        "Content-Type": "application/json",
                        Authorization: `Bearer ${token}`,
                    },
                });

                if (response.ok) {
                    localStorage.clear();
                    window.location.href = "/"; // Redireciona para a home após logout
                } else {
                    const result = await response.json();
                    console.error("Erro no logout:", result.message);
                    alert("Erro ao sair: " + result.message);
                }
            } catch (err) {
                console.error("Erro ao tentar logout:", err);
                alert("Erro inesperado ao sair.");
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const nomeUsuario = localStorage.getItem("usuario_nome") || "Usuário";
            const btnUsuario = document.querySelector(".username-btn");
            if (btnUsuario) btnUsuario.innerHTML = `<i class="bi bi-person-circle"></i> ${nomeUsuario}`;
            fetchTickets();
            document.getElementById("btnCard").addEventListener("click", () => { modoVisualizacao = "card"; aplicarFiltros(); });
            document.getElementById("btnList").addEventListener("click", () => { modoVisualizacao = "list"; aplicarFiltros(); });
        });
    </script>

</body>

</html>
