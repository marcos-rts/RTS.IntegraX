<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <title>Editar Ticket</title>
    <link href="../bootstrap-5.3.7-dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <h3 class="mb-4">✏️ Editar Ticket</h3>
        <form id="formEditar">
            <div class="mb-3">
                <label for="title" class="form-label">Título</label>
                <input type="text" id="title" name="title" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Descrição</label>
                <textarea id="description" name="description" class="form-control" rows="4" required></textarea>
            </div>

            <div class="mb-3">
                <label for="prioridade" class="form-label">Prioridade</label>
                <select id="prioridade" name="prioridade" class="form-select" required>
                    <option value="Baixa">Baixa</option>
                    <option value="Média">Média</option>
                    <option value="Alta">Alta</option>
                    <option value="Crítica">Crítica</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="status_id" class="form-label">Status</label>
                <input type="number" id="status_id" name="status_id" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="grupo_id" class="form-label">Grupo</label>
                <input type="number" id="grupo_id" name="grupo_id" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="solicitante_id" class="form-label">Solicitante</label>
                <input type="number" id="solicitante_id" name="solicitante_id" class="form-control">
            </div>

            <div class="mb-3">
                <label for="url_repositorio" class="form-label">URL do Repositório</label>
                <input type="url" id="url_repositorio" name="url_repositorio" class="form-control">
            </div>

            <button type="submit" class="btn btn-success"><i class="bi bi-save"></i> Salvar Alterações</button>
            <a href="/lista_tickets" class="btn btn-secondary"><i class="bi bi-arrow-return-left"></i> Voltar</a>
        </form>

        <div id="alerta" class="alert mt-3 d-none"></div>
    </div>

    <script>
        const ticketId = window.location.pathname.match(/\/ticket_editar\/(\d+)/)[1];
        const token = localStorage.getItem("token");

        document.addEventListener("DOMContentLoaded", async () => {
            // Carregar dados atuais do ticket
            const res = await fetch(`/api/tickets/${ticketId}`, {
                headers: { "Authorization": `Bearer ${token}` }
            });
            const ticket = await res.json();

            document.getElementById("title").value = ticket.title_ticket;
            document.getElementById("description").value = ticket.description_ticket;
            document.getElementById("prioridade").value = ticket.prioriedade_ticket;
            document.getElementById("status_id").value = ticket.status_id || "";
            document.getElementById("grupo_id").value = ticket.grupo_id || "";
            document.getElementById("solicitante_id").value = ticket.id_pessoa || "";
            document.getElementById("url_repositorio").value = ticket.url_repositorio || "";
        });

        document.getElementById("formEditar").addEventListener("submit", async (e) => {
            e.preventDefault();
            const payload = {
                title: document.getElementById("title").value,
                description: document.getElementById("description").value,
                prioridade: document.getElementById("prioridade").value,
                status_id: document.getElementById("status_id").value,
                grupo_id: document.getElementById("grupo_id").value,
                solicitante_id: document.getElementById("solicitante_id").value,
                url_repositorio: document.getElementById("url_repositorio").value,
                atualizado_por_id: localStorage.getItem("usuario_id")
            };

            const res = await fetch(`/api/tickets/${ticketId}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify(payload)
            });

            const result = await res.json();
            const alerta = document.getElementById("alerta");

            if (res.ok) {
                alerta.className = "alert alert-success";
                alerta.textContent = result.message;
                alerta.classList.remove("d-none");
            } else {
                alerta.className = "alert alert-danger";
                alerta.textContent = result.error || "Erro ao atualizar ticket.";
                alerta.classList.remove("d-none");
            }
        });
    </script>
</body>

</html>
