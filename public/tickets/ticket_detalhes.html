<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Detalhes do Ticket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="/scripts/ticket_detalhes.js"></script>
</head>

<body class="bg-light">

    <div class="container py-4">
        <h2 class="mb-4">🎟️ Detalhes do Ticket</h2>

        <div id="ticket-container" class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title" id="ticket-titulo">Carregando...</h5>
                <p class="card-text" id="ticket-descricao"></p>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item"><strong>ID:</strong> <span id="ticket-id"></span></li>
                    <li class="list-group-item"><strong>Prioridade:</strong> <span id="ticket-prioridade"></span></li>
                    <li class="list-group-item"><strong>Status:</strong> <span id="ticket-status"></span></li>
                    <li class="list-group-item"><strong>Grupo:</strong> <span id="ticket-grupo"></span></li>
                    <li class="list-group-item"><strong>Responsável:</strong> <span id="ticket-responsavel"></span></li>
                </ul>
            </div>
        </div>

        <div id="erro" class="alert alert-danger d-none mt-3" role="alert">
            Não foi possível carregar o ticket.
        </div>
    </div>
    <script>
        
        document.addEventListener('DOMContentLoaded', async () => {
            const ticketId = getIdFromURL();

            if (!ticketId) {
                mostrarErro("ID do ticket não especificado na URL.");
                return;
            }

            try {
                const token = localStorage.getItem("token");

                const res = await fetch(`/api/tickets/${ticketId}`, {
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                });


                if (!res.ok) throw new Error("Erro ao buscar ticket");

                const ticket = await res.json();
                preencherDetalhes(ticket);
            } catch (err) {
                mostrarErro("Falha ao carregar os dados do ticket.");
                console.error(err);
            }
        });

        function getIdFromURL() {
            const path = window.location.pathname;
            const match = path.match(/\/ticket_detalhes\/(\d+)/);
            return match ? match[1] : null;
        }
        function preencherDetalhes(ticket) {
            document.getElementById("ticket-titulo").textContent = ticket.Titulo || "(Sem título)";
            document.getElementById("ticket-descricao").textContent = ticket.Descricao || "(Sem descrição)";
            document.getElementById("ticket-id").textContent = ticket.ID || "-";
            document.getElementById("ticket-prioridade").textContent = ticket.Prioridade || "-";
            document.getElementById("ticket-status").textContent = ticket.Status || "-";
            document.getElementById("ticket-grupo").textContent = ticket.Grupo || "-";
            document.getElementById("ticket-responsavel").textContent = ticket.Responsavel || "-";
        }

        function mostrarErro(mensagem) {
            const erroDiv = document.getElementById("erro");
            erroDiv.textContent = mensagem;
            erroDiv.classList.remove("d-none");
        }

    </script>
</body>

</html>
