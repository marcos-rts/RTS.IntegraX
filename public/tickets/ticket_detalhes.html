<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Detalhes do Ticket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-4">
        <h2 class="mb-4">🎟️ Detalhes do Ticket</h2>

        <div id="ticket-container" class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title" id="ticket-titulo">Carregando...</h5>
                <p class="card-text" id="ticket-descricao"></p>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item"><strong>ID:</strong> <span id="ticket-id"></span></li>
                    <li class="list-group-item"><strong>Prioridade:</strong> <span id="ticket-prioridade"></span></li>
                    <li class="list-group-item"><strong>Status:</strong> <span id="ticket-status"></span></li>
                    <li class="list-group-item"><strong>Grupo:</strong> <span id="ticket-grupo"></span></li>
                    <li class="list-group-item"><strong>Responsável:</strong> <span id="ticket-responsavel"></span></li>
                    <li class="list-group-item"><strong>URL do Repositório:</strong> <a id="ticket-url_repositorio"
                            href="#" target="_blank">Abrir</a></li>
                </ul>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover table-bordered align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Status</th>
                        <th>Tipo</th>
                        <th>Link</th>
                    </tr>
                </thead>
                <tbody id="tabelaGithub">
                    <tr>
                        <td colspan="5" class="text-center">Carregando dados do GitHub...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div id="erro" class="alert alert-danger d-none mt-3" role="alert">
            Não foi possível carregar o ticket.
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const ticketId = getIdFromURL();
            if (!ticketId) return mostrarErro("ID do ticket não especificado na URL.");

            try {
                const token = localStorage.getItem("token");

                const res = await fetch(`/api/tickets/${ticketId}`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (!res.ok) throw new Error("Erro ao buscar ticket");

                const dados = await res.json();
                console.log("Resposta da API:", dados); // 👈 DEBUG

                if (!dados || !dados.id_ticket) {
                    mostrarErro("Ticket não encontrado ou sem dados.");
                    return;
                }

                preencherDetalhes(dados);
                preencherGithub(dados.github_itens || []);
            } catch (err) {
                mostrarErro("Falha ao carregar os dados do ticket.");
                console.error(err);
            }
        });


        function getIdFromURL() {
            const match = window.location.pathname.match(/\/ticket_detalhes\/(\d+)/);
            return match ? match[1] : null;
        }

        function preencherDetalhes(ticket) {
            document.getElementById("ticket-titulo").textContent = ticket.title_ticket || "(Sem título)";
            document.getElementById("ticket-descricao").textContent = ticket.description_ticket || "(Sem descrição)";
            document.getElementById("ticket-id").textContent = ticket.id_ticket || "-";
            document.getElementById("ticket-prioridade").textContent = ticket.prioriedade_ticket || "-";
            document.getElementById("ticket-status").textContent = ticket.status || "-";
            document.getElementById("ticket-grupo").textContent = ticket.Grupo || "-";
            document.getElementById("ticket-responsavel").textContent = ticket.nome_pessoa || "-";

            const link = document.getElementById("ticket-url_repositorio");
            if (ticket.url_repositorio) {
                link.href = ticket.url_repositorio;
                link.textContent = "Abrir";
            } else {
                link.textContent = "-";
                link.removeAttribute("href");
            }
        }

        function preencherGithub(itens) {
            const tabela = document.getElementById("tabelaGithub");
            tabela.innerHTML = "";

            const itensValidos = itens.filter(item => item.github_id != null);

            if (itensValidos.length === 0) {
                tabela.innerHTML = `<tr><td colspan="5" class="text-center">Nenhum item do GitHub vinculado.</td></tr>`;
                return;
            }

            itensValidos.forEach(item => {
                tabela.innerHTML += `
            <tr>
                <td>${item.github_id}</td>
                <td>${item.titulo}</td>
                <td>${item.status}</td>
                <td>${item.tipo || 'N/A'}</td>
                <td><a href="${item.url}" target="_blank">Ver</a></td>
            </tr>
        `;
            });
        }


        function mostrarErro(mensagem) {
            const erroDiv = document.getElementById("erro");
            erroDiv.textContent = mensagem;
            erroDiv.classList.remove("d-none");
        }
    </script>
</body>

</html>
