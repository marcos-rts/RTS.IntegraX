    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <title>Nova Conta - RTS IntegraX</title>
    <script>
        // Função para verificar validade do token
        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(function (c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));

                return JSON.parse(jsonPayload);
            } catch (e) {
                return null;
            }
        }

        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = "/";
        } else {
            const payload = parseJwt(token);
            const now = Math.floor(Date.now() / 1000);
            if (!payload || payload.exp < now) {
                localStorage.removeItem('token');
                window.location.href = "/";
            }
        }
    </script>
</head>

    <main class="container mt-5 pt-5">
        <div class="p-4 bg-light rounded shadow-sm">
            <h2 class="mb-4">Cadastrar Nova Conta</h2>
            <form id="formConta">
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome da Conta</label>
                    <input type="text" class="form-control" id="nome" name="nome" required>
                </div>
                <div class="mb-3">
                    <label for="descricao" class="form-label">Descrição</label>
                    <input type="text" class="form-control" id="descricao" name="descricao" required>
                </div>
                <div class="mb-3">
                    <label for="carteira_id" class="form-label">Carteira</label>
                    <div class="input-group">
                        <select id="carteira_id" name="carteira_id" class="form-select" required></select>
                        <a href="/nova_carteira" class="btn btn-outline-success" title="Cadastrar nova carteira">
                            <i class="bi bi-plus-circle"></i>
                        </a>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="status" class="form-label">Status</label>
                    <select class="form-select" id="status" required></select>
                </div>
                <button type="submit" class="btn btn-success" id="btnSalvar">Salvar</button>
                <a href="/contas" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </main>

    <script src="bootstrap-5.3.7-dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const nomeUsuario = localStorage.getItem("usuario_nome") || "Usuário";
        const btnUsuario = document.querySelector(".username-btn");
        if (btnUsuario) {
            btnUsuario.innerHTML = `<i class="bi bi-person-circle"></i> ${nomeUsuario}`;
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const token = localStorage.getItem("token");
            if (!token) return (window.location.href = "/");

            const [statusResp] = await Promise.all([
                fetch("/api/status?tipoBanco=FX", {
                    method: "GET",
                    headers: {
                        Authorization: `Bearer ${token}`,
                    },
                })
            ]);
            const status = await statusResp.json();
            const statusSelect = document.getElementById("status");

            status.forEach(s => {
                statusSelect.innerHTML += `<option value="${s.id_status}">${s.id_nome}</option>`;
            });

            // Carregar carteiras
            async function carregarCarteiras() {
                try {
                    const res = await fetch("/api/finanx/carteiras", {
                        headers: { Authorization: `Bearer ${token}` }
                    });
                    if (!res.ok) throw new Error("Erro ao buscar carteiras");
                    const data = await res.json();

                    const select = document.getElementById("carteira_id");
                    select.innerHTML = "";
                    if (data.length === 0) {
                        const opt = document.createElement("option");
                        opt.textContent = "Nenhuma carteira cadastrada";
                        opt.disabled = true;
                        opt.selected = true;
                        select.appendChild(opt);
                    } else {
                        data.forEach(item => {
                            const opt = document.createElement("option");
                            opt.value = item.id;
                            opt.textContent = item.nome;
                            select.appendChild(opt);
                        });
                    }
                } catch (err) {
                    alert(err.message);
                }
            }
            await carregarCarteiras();

            // Envio do formulário
            document.getElementById("formConta").addEventListener("submit", async (e) => {
                e.preventDefault();
                const btnSalvar = document.getElementById("btnSalvar");
                btnSalvar.disabled = true;
                btnSalvar.textContent = "Salvando...";

                const token = localStorage.getItem("token");

                // const body = Object.fromEntries(new FormData(e.target).entries());

                const body = {
                    nome: document.getElementById("nome").value,
                    descricao: document.getElementById("descricao").value,
                    carteira_id: parseInt(document.getElementById("carteira_id").value),
                    // responsavel_id: parseInt(localStorage.getItem("pessoa_id")),
                    criado_por_id: parseInt(localStorage.getItem("usuario_id"))
                };

                try {
                    const res = await fetch("/api/finanx/contas", {
                        method: "POST",
                        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
                        body: JSON.stringify(body)
                    });

                    const result = await res.json();
                    if (res.ok) {
                        alert(result.message || "Conta cadastrada!");
                        window.location.href = "/contas";
                    } else {
                        alert("Erro: " + (result.message || "Não foi possível salvar."));
                    }
                } catch (err) {
                    alert("Erro inesperado: " + err.message);
                } finally {
                    btnSalvar.disabled = false;
                    btnSalvar.textContent = "Salvar";
                }
            });
        });

        async function logout() {
            try {
                const token = localStorage.getItem("token");
                if (!token) {
                    window.location.href = "/";
                    return;
                }

                const response = await fetch("/api/autenticacao/logout", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        Authorization: `Bearer ${token}`,
                    },
                });

                if (response.ok) {
                    localStorage.clear();
                    window.location.href = "/";
                } else {
                    const result = await response.json();
                    alert("Erro ao sair: " + result.message);
                }
            } catch (err) {
                alert("Erro inesperado ao sair.");
            }
        }
    </script>
</body>
