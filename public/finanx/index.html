<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="bootstrap-5.3.7-dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <title>IntegraX - Visão Geral</title>
    <script>
        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(function (c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch (e) {
                return null;
            }
        }
        const token = localStorage.getItem('token');
        if (!token) { window.location.href = "/"; }
        else {
            const payload = parseJwt(token);
            const now = Math.floor(Date.now() / 1000);
            if (!payload || payload.exp < now) {
                localStorage.removeItem('token');
                window.location.href = "/";
            }
        }
    </script>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/painel">RTS IntegraX</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#offcanvasDarkNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="offcanvas offcanvas-end text-bg-dark" id="offcanvasDarkNavbar">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title">Menu Opções</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav">
                        <li class="nav-item"><a class="nav-link active" href="/financeiro/fx_visao_geral.html">Visão
                                Geral</a></li>
                        <li class="nav-item"><a class="nav-link" href="/financeiro/fx_nova_transacao.html">Nova
                                Transação</a></li>
                        <li class="nav-item"><a class="nav-link" href="/financeiro/fx_relatorios.html">Relatórios</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Conteúdo -->
    <div class="container" style="margin-top:80px;">
        <h1>Visão Geral Financeira</h1>
        <div class="row my-4">
            <div class="col-md-4">
                <div class="card text-center shadow">
                    <div class="card-body">
                        <h5>Saldo Total</h5>
                        <h3 class="text-primary">R$ 12.458,73</h3>
                        <small>Disponível em contas</small>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center shadow">
                    <div class="card-body">
                        <h5>Receitas do Mês</h5>
                        <h3 class="text-success">R$ 8.520,00</h3>
                        <small>+12% vs mês anterior</small>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center shadow">
                    <div class="card-body">
                        <h5>Despesas do Mês</h5>
                        <h3 class="text-danger">R$ 5.342,27</h3>
                        <small>-5% vs mês anterior</small>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow">
            <div class="card-header d-flex justify-content-between">
                <span>Últimas Transações</span>
                <a href="/financeiro/fx_relatorios.html" class="btn btn-sm btn-outline-primary">Ver todas</a>
            </div>
            <ul class="list-group list-group-flush" id="recent-transactions">
                <!-- via JS -->
            </ul>
        </div>
    </div>

    <script>
        const transactions = [
            { descricao: "Salário Mensal", categoria: "Salário", data: "2023-10-05", conta: "Conta Corrente", tipo: "Entrada", valor: 3500 },
            { descricao: "Supermercado", categoria: "Alimentação", data: "2023-10-07", conta: "Cartão", tipo: "Saída", valor: 120.50 },
            { descricao: "Aluguel", categoria: "Moradia", data: "2023-10-10", conta: "Conta Corrente", tipo: "Saída", valor: 380 },
        ];
        function formatDate(d) { return new Date(d).toLocaleDateString('pt-BR'); }
        const container = document.getElementById("recent-transactions");
        transactions.forEach(t => {
            const li = document.createElement("li");
            li.className = "list-group-item d-flex justify-content-between";
            li.innerHTML = `<div><strong>${t.descricao}</strong><br><small>${t.categoria} • ${formatDate(t.data)} • ${t.conta}</small></div>
                      <span class="${t.tipo === 'Entrada' ? 'text-success' : 'text-danger'}">
                        ${t.tipo === 'Entrada' ? '+' : '-'} R$ ${t.valor.toFixed(2)}
                      </span>`;
            container.appendChild(li);
        });
    </script>

    <script src="bootstrap-5.3.7-dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
