    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <title>RTS IntegraX - Nova Transação</title>

    <script>
        // Função para verificar validade do token
        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(function (c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));

                return JSON.parse(jsonPayload);
            } catch (e) {
                return null;
            }
        }

        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = "/";
        } else {
            const payload = parseJwt(token);
            const now = Math.floor(Date.now() / 1000);
            if (!payload || payload.exp < now) {
                localStorage.removeItem('token');
                window.location.href = "/";
            }
        }
    </script>
</head>

                        <li class="nav-item">

                    <form class="d-flex mt-3" role="search">

    <!-- Conteúdo principal -->

    <main class="container mt-5 pt-5">
        <div class="p-4 bg-light rounded shadow-sm">
            <h2 class="mb-4"><i class="bi bi-plus-circle"></i> Nova Transação</h2>

            <form id="formTransacao">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="valor" class="form-label">Valor</label>
                        <input type="number" step="0.01" class="form-control" id="valor" name="valor" required>
                    </div>

                    <div class="col-md-6">
                        <label for="tipo" class="form-label">Tipo</label>
                        <select class="form-select" id="tipo" name="tipo" required>
                            <option value="entrada">Entrada</option>
                            <option value="saida">Saída</option>
                            <option value="transferencia">Transferência</option>
                        </select>
                    </div>

                    <!-- Conta -->
                    <div class="col-md-6">
                        <label for="conta_id" class="form-label">Conta</label>
                        <div class="input-group">
                            <select class="form-select" id="conta_id" name="conta_id" required></select>
                            <a href="/nova_conta" class="btn btn-outline-success" title="Cadastrar nova conta">
                                <i class="bi bi-plus-circle"></i>
                            </a>
                        </div>
                    </div>

                    <!-- Pessoa -->
                    <div class="col-md-6">
                        <label for="pessoa_id" class="form-label">Pessoa</label>
                        <div class="input-group">
                            <select class="form-select" id="pessoa_id" name="pessoa_id"></select>
                            <a href="/nova_pessoa" class="btn btn-outline-success" title="Cadastrar nova pessoa">

                            </a>
                        </div>
                    </div>

                    <!-- Categoria/Subcategoria -->
                    <div class="col-md-6">
                        <label for="categoria_id" class="form-label">Categoria</label>
                        <div class="input-group">
                            <select class="form-select" id="categoria_id" name="categoria_id" required></select>
                            <a href="/nova_categoria" class="btn btn-outline-success" title="Cadastrar nova categoria">
                                <i class="bi bi-plus-circle"></i>
                            </a>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="subcategoria_id" class="form-label">Subcategoria</label>
                        <select class="form-select" id="subcategoria_id" name="subcategoria_id"></select>
                    </div>

                    <div class="col-12">
                        <label for="informacao" class="form-label">Informações</label>
                        <textarea class="form-control" id="informacao" name="informacao" rows="2"></textarea>
                    </div>

                    <div class="col-12">
                        <label for="observacao" class="form-label">Observações</label>
                        <textarea class="form-control" id="observacao" name="observacao" rows="2"></textarea>
                    </div>

                    <div class="col-12">
                        <button type="submit" class="btn btn-success">Salvar</button>
                        <a href="/finanxIndex" class="btn btn-secondary">Cancelar</a>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <script src="bootstrap-5.3.7-dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const token = localStorage.getItem("token");
            const nomeUsuario = localStorage.getItem("usuario_nome") || "Usuário";

            const btnUsuario = document.querySelector(".username-btn");
            if (btnUsuario) {
                btnUsuario.innerHTML = `<i class="bi bi-person-circle"></i> ${nomeUsuario}`;
            }

            // Envio do formulário
            const form = document.getElementById("transacaoForm");
            form.addEventListener("submit", async (e) => {
                e.preventDefault();

                const formData = new FormData(form);
                const data = Object.fromEntries(formData.entries());
                data.criado_por_id = localStorage.getItem("usuario_id"); // salva quem criou

                try {
                    const response = await fetch("/api/finanx/transacoes", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": `Bearer ${token}`
                        },
                        body: JSON.stringify(data)
                    });

                    const result = await response.json();
                    if (response.ok) {
                        alert("Transação criada com sucesso!");
                        window.location.href = "/finanxIndex";
                    } else {
                        alert("Erro: " + (result.error || "Não foi possível salvar"));
                    }
                } catch (err) {
                    console.error("Erro ao salvar transação:", err);
                    alert("Erro inesperado ao salvar transação");
                }
            });
        });

        async function logout() {
            try {
                const token = localStorage.getItem("token");
                if (!token) {
                    window.location.href = "/";
                    return;
                }

                const response = await fetch("/api/autenticacao/logout", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        Authorization: `Bearer ${token}`,
                    },
                });

                if (response.ok) {
                    localStorage.clear();
                    window.location.href = "/";
                } else {
                    const result = await response.json();
                    alert("Erro ao sair: " + result.message);
                }
            } catch (err) {
                alert("Erro inesperado ao sair.");
            }
        }
    </script>
</body>
