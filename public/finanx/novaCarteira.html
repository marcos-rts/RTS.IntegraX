<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="bootstrap-5.3.7-dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <title>Nova Conta - RTS IntegraX</title>
    <script>
        // Função para verificar validade do token
        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(function (c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));

                return JSON.parse(jsonPayload);
            } catch (e) {
                return null;
            }
        }

        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = "/";
        } else {
            const payload = parseJwt(token);
            const now = Math.floor(Date.now() / 1000);
            if (!payload || payload.exp < now) {
                localStorage.removeItem('token');
                window.location.href = "/";
            }
        }
    </script>
</head>

    <main class="container mt-5 pt-5">
        <div class="p-4 bg-light rounded shadow-sm">
            <h2 class="mb-4">Cadastrar Nova Carteira</h2>
            <form id="formCarteira">
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome da Carteira</label>
                    <input type="text" class="form-control" id="nome" name="nome" required>
                </div>
                <div class="mb-3">
                    <label for="descricao" class="form-label">Descrição</label>
                    <input type="text" class="form-control" id="descricao" name="descricao" required>
                </div>
                <button type="submit" class="btn btn-success">Salvar</button>
                <a href="/carteiras" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </main>

    <script src="bootstrap-5.3.7-dist/js/bootstrap.bundle.min.js"></script>
    <script>


        document.addEventListener("DOMContentLoaded", async () => {
            const token = localStorage.getItem("token");
            if (!token) return (window.location.href = "/");

            const nomeUsuario = localStorage.getItem("usuario_nome") || "Usuário";

            const btnUsuario = document.querySelector(".username-btn");
            if (btnUsuario) {
                btnUsuario.innerHTML = `<i class="bi bi-person-circle"></i> ${nomeUsuario}`;
            }

            document.getElementById("formCarteira").addEventListener("submit", async (e) => {
                e.preventDefault();

                const token = localStorage.getItem("token");

                const carteira = {
                    nome: document.getElementById("nome").value,
                    descricao: document.getElementById("descricao").value,
                    responsavel_id: parseInt(localStorage.getItem("pessoa_id")),
                    criado_por_id: parseInt(localStorage.getItem("usuario_id"))
                }
                const res = await fetch("/api/finanx/carteiras", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
                    body: JSON.stringify(carteira)
                });

                if (res.ok) {
                    alert("Carteira cadastrada!");
                    window.location.href = "/carteiras";
                } else {
                    alert("Erro ao salvar carteira!");
                }
            });
        });
        async function logout() {
            try {
                const token = localStorage.getItem("token");
                if (!token) {
                    window.location.href = "/";
                    return;
                }

                const response = await fetch("/api/autenticacao/logout", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        Authorization: `Bearer ${token}`,
                    },
                });

                if (response.ok) {
                    localStorage.clear();
                    window.location.href = "/";
                } else {
                    const result = await response.json();
                    alert("Erro ao sair: " + result.message);
                }
            } catch (err) {
                alert("Erro inesperado ao sair.");
            }
        }
    </script>
</body>
