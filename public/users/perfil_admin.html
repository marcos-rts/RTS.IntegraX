<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="bootstrap-5.3.7-dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <title>Perfil Administrativo - RTS IntegraX</title>
</head>

<body class="bg-light">
    <div class="container mt-5 pt-5">
        <div class="card shadow-lg">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="bi bi-person-gear me-2"></i>Configurações de Perfil (Admin)</h5>
                <a href="/painel" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left"></i> Voltar</a>
            </div>
            <div class="card-body">
                <div class="row">
                    <!-- Dados do Usuário -->
                    <div class="col-md-6">
                        <h6 class="fw-bold mb-3">Informações da Conta</h6>
                        <form id="formPerfilAdmin">
                            <div class="mb-3">
                                <label class="form-label">Usuário</label>
                                <input type="text" id="usuario" class="form-control" disabled>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" id="email" class="form-control">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Celular (2FA)</label>
                                <input type="text" id="celular" class="form-control">
                            </div>
                            <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Salvar
                                Alterações</button>
                        </form>
                    </div>

                    <!-- Configurações Avançadas -->
                    <div class="col-md-6 border-start">
                        <h6 class="fw-bold mb-3">Gerenciamento Avançado</h6>
                        <ul class="list-group">
                            <li class="list-group-item"><a href="/controle_usuarios"><i class="bi bi-people"></i>
                                    Controle de Usuários</a></li>
                            <li class="list-group-item"><a href="/marcadores"><i class="bi bi-tags"></i> Marcadores</a>
                            </li>
                            <li class="list-group-item"><a href="/empresas"><i class="bi bi-building"></i> Empresas</a>
                            </li>
                            <li class="list-group-item"><a href="/status"><i class="bi bi-ui-checks"></i> Status do
                                    Sistema</a></li>
                            <li class="list-group-item"><a href="/auditoria"><i class="bi bi-journal-text"></i> Logs e
                                    Auditoria</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="bootstrap-5.3.7-dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const tipo = localStorage.getItem("usuario_tipo");
            if (tipo !== "Admin") {
                alert("Acesso restrito a administradores.");
                window.location.href = "/painel";
            }
            const nome = localStorage.getItem("usuario_nome");
            document.getElementById("usuario").value = nome;
        });
    </script>
</body>

</html>
