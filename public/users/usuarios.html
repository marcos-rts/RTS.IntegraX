<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="bootstrap-5.3.7-dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <title>RTS IntegraX</title>

    <script>
        // Função para verificar validade do token
        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(atob(base64).split('').map(function (c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));

                return JSON.parse(jsonPayload);
            } catch (e) {
                return null;
            }
        }

        const token = localStorage.getItem('token');

        if (!token) {
            // Token não existe, redireciona para login
            window.location.href = "/";
        } else {
            const payload = parseJwt(token);
            const now = Math.floor(Date.now() / 1000);

            if (!payload || payload.exp < now) {
                // Token expirado
                localStorage.removeItem('token');
                window.location.href = "/";
            }

            // Caso queira: 
            console.log("Token válido. Bem-vindo!");
        }
    </script>
</head>

<body>

    <nav class="navbar navbar-dark bg-dark fixed-top">

                aria-labelledby="offcanvasDarkNavbarLabel">

                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"

                    <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle username-btn" href="#" role="button"
                                data-bs-toggle="dropdown" aria-expanded="false">
                                Carregando...
                            </a>
                            <ul class="dropdown-menu dropdown-menu-dark">
                                <li><a class="dropdown-item" href="/controle_usuarios"> <i
                                            class="bi bi-person-gear"></i> Controle de Usuarios</a></li>
                                <li><a class="dropdown-item" href="#">Another action</a></li>
                                <li>
                                    <hr class="dropdown-divider">

                        <li class="nav-item">

                        </li>
                    </ul>
                    <form class="d-flex mt-3" role="search">
                        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                        <button class="btn btn-success" type="submit">Search</button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <main class="container mt-5 pt-5">
        <div class="p-4 bg-light rounded shadow-sm">
            <!-- Aqui vai o conteúdo central de cada módulo -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="mb-0">Lista de Usuários</h3>
                <a href="/cadastrar_usuario" class="btn btn-primary">
                    <i class="bi bi-person-plus-fill"></i> Novo Usuário
                </a>
            </div>
            <div class="table-responsive">
                <table class="table table-striped table-hover table-bordered align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Email</th>
                            <th>Grupo</th>
                            <th>Tipo</th>
                            <th>Ativo</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaUsuarios">
                        <tr>
                            <td colspan="6" class="text-center">Carregando usuários...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>


    <script src="bootstrap-5.3.7-dist/js/bootstrap.bundle.min.js"></script>
    <script>

        document.addEventListener("DOMContentLoaded", () => {
            const token = localStorage.getItem("token");
            if (!token) {
                window.location.href = "/"; // ou login.html, se estiver separado
                return;
            }

            const nomeUsuario = localStorage.getItem("usuario_nome") || "Usuário";

            const btnUsuario = document.querySelector(".username-btn");
            // const saudacao = document.querySelector("h3");

            if (btnUsuario) {
                btnUsuario.innerHTML = `<i class="bi bi-person-circle"></i> ${nomeUsuario}`;
            }

            carregarUsuarios();
        });

        async function logout() {
            try {
                const token = localStorage.getItem("token");
                if (!token) {
                    // Já está deslogado
                    window.location.href = "/";
                    return;
                }

                const response = await fetch("/api/autenticacao/logout", {
                    method: "POST", // ou DELETE, se quiser mais semântico
                    headers: {
                        "Content-Type": "application/json",
                        Authorization: `Bearer ${token}`,
                    },
                });

                if (response.ok) {
                    localStorage.clear();
                    window.location.href = "/"; // Redireciona para a home após logout
                } else {
                    const result = await response.json();
                    console.error("Erro no logout:", result.message);
                    alert("Erro ao sair: " + result.message);
                }
            } catch (err) {
                console.error("Erro ao tentar logout:", err);
                alert("Erro inesperado ao sair.");
            }
        }

        async function carregarUsuarios() {
            const tbody = document.getElementById("tabelaUsuarios");
            try {
                const token = localStorage.getItem("token");
                const response = await fetch("/api/autenticacao/users", {
                    headers: {
                        Authorization: `Bearer ${token}`
                    }
                });

                if (!response.ok) throw new Error("Erro ao carregar os usuários.");

                const usuarios = await response.json();

                if (!usuarios.length) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center">Nenhum usuário encontrado.</td></tr>`;
                    return;
                }

                tbody.innerHTML = "";
                usuarios.forEach((usuario) => {
                    tbody.innerHTML += `
              <tr>
                <td>${usuario.id}</td>
                <td>${usuario.usuario}</td>
                <td>${usuario.email}</td>
                <td>${usuario.grupo || 'N/A'}</td>
                <td>${usuario.tipo}</td>
                <td>${usuario.ativo}</td>
              </tr>
            `;
                });
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger">Erro ao carregar dados.</td></tr>`;
                console.error(err);
            }
        }
    </script>
</body>

</html>
