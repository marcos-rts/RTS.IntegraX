<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Usuários - Sistema Modular</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    body {
      background-color: #f1f3f4;
    }

    .sidebar {
      height: 100vh;
      background: linear-gradient(180deg, #212529, #343a40);
      color: white;
      position: fixed;
      top: 0;
      left: 0;
      width: 250px;
      padding-top: 60px;
    }

    .sidebar a {
      color: #adb5bd;
      text-decoration: none;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      transition: 0.3s;
    }

    .sidebar a:hover {
      background-color: #495057;
      color: white;
    }

    .sidebar i {
      margin-right: 10px;
    }

    .content {
      margin-left: 250px;
      padding: 2rem;
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 250px;
      right: 0;
      height: 60px;
      background-color: #ffffff;
      border-bottom: 1px solid #dee2e6;
      z-index: 1000;
      padding: 0 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .topbar h5 {
      margin: 0;
    }

    .username-btn {
      font-size: 0.9rem;
    }

    .table-responsive {
      margin-top: 2rem;
    }

    .table th,
    .table td {
      vertical-align: middle;
    }
  </style>
</head>

<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <a href="/painel"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="#"><i class="bi bi-folder2-open"></i> Documentos</a>
    <a href="#"><i class="bi bi-tools"></i> Manutenção</a>
    <a href="usuarios.html"><i class="bi bi-people"></i> Usuários</a>
    <a href="#"><i class="bi bi-gear"></i> Configurações</a>
    <a href="#"><i class="bi bi-bar-chart-line"></i> Relatórios</a>
  </div>

  <!-- Topbar -->
  <div class="topbar">
    <h5>Usuários</h5>
    <div class="d-flex gap-2">
      <button class="btn btn-outline-primary username-btn">
        <i class="bi bi-person-circle"></i> Carregando...
      </button>
      <button onclick="logout()" class="btn btn-outline-danger btn-sm">Sair</button>
    </div>
  </div>

  <!-- Conteúdo -->
  <div class="content mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="mb-0">Lista de Usuários</h3>
      <a href="/cadastrar_usuario" class="btn btn-primary">
        <i class="bi bi-person-plus-fill"></i> Novo Usuário
      </a>
    </div>
    <div class="table-responsive">
      <table class="table table-striped table-hover table-bordered align-middle">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Email</th>
            <th>Grupo</th>
            <th>Tipo</th>
            <th>Ativo</th>
          </tr>
        </thead>
        <tbody id="tabelaUsuarios">
          <tr>
            <td colspan="5" class="text-center">Carregando usuários...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const token = localStorage.getItem("token");
      const nomeUsuario = localStorage.getItem("usuario_nome") || "Usuário";

      if (!token) {
        window.location.href = "/";
        return;
      }

      const btnUsuario = document.querySelector(".username-btn");
      if (btnUsuario) {
        btnUsuario.innerHTML = `<i class="bi bi-person-circle"></i> ${nomeUsuario}`;
      }

      carregarUsuarios();
    });

    async function logout() {
      try {
        const token = localStorage.getItem("token");
        if (!token) {
          // Já está deslogado
          window.location.href = "/";
          return;
        }

        const response = await fetch("http://localhost:3000/api/autenticacao/logout", {
          method: "POST", // ou DELETE, se quiser mais semântico
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          },
        });

        if (response.ok) {
          localStorage.clear();
          window.location.href = "/"; // Redireciona para a home após logout
        } else {
          const result = await response.json();
          console.error("Erro no logout:", result.message);
          alert("Erro ao sair: " + result.message);
        }
      } catch (err) {
        console.error("Erro ao tentar logout:", err);
        alert("Erro inesperado ao sair.");
      }
    }

    async function carregarUsuarios() {
      const tbody = document.getElementById("tabelaUsuarios");
      try {
        const token = localStorage.getItem("token");
        const response = await fetch("http://localhost:3000/api/autenticacao/users", {
          headers: {
            Authorization: `Bearer ${token}`
          }
        });

        if (!response.ok) throw new Error("Erro ao carregar os usuários.");

        const usuarios = await response.json();

        if (!usuarios.length) {
          tbody.innerHTML = `<tr><td colspan="5" class="text-center">Nenhum usuário encontrado.</td></tr>`;
          return;
        }

        tbody.innerHTML = "";
        usuarios.forEach((usuario) => {
          tbody.innerHTML += `
              <tr>
                <td>${usuario.id}</td>
                <td>${usuario.usuario}</td>
                <td>${usuario.email}</td>
                <td>${usuario.grupo || 'N/A'}</td>
                <td>${usuario.tipo}</td>
                <td>${usuario.ativo}</td>
              </tr>
            `;
        });
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger">Erro ao carregar dados.</td></tr>`;
        console.error(err);
      }
    }
  </script>
</body>

</html>
