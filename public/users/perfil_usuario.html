<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="bootstrap-5.3.7-dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <title>Perfil do Usuário - RTS IntegraX</title>
</head>
<body class="bg-light">
  <div class="container mt-5 pt-5">
    <div class="card shadow-lg">
      <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="bi bi-person-circle me-2"></i>Meu Perfil</h5>
        <a href="/painel" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left"></i> Voltar</a>
      </div>
      <div class="card-body">
        <form id="formPerfilUsuario">
          <div class="mb-3">
            <label class="form-label">Usuário</label>
            <input type="text" id="usuario" class="form-control" disabled>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" id="email" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Celular</label>
            <input type="text" id="celular" class="form-control">
          </div>
          <hr>
          <h6 class="fw-bold mb-3">Alterar Senha</h6>
          <div class="mb-3">
            <label class="form-label">Nova Senha</label>
            <input type="password" id="novaSenha" class="form-control">
          </div>
          <button type="submit" class="btn btn-success"><i class="bi bi-save"></i> Salvar Alterações</button>
        </form>
      </div>
    </div>
  </div>

  <script src="bootstrap-5.3.7-dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const tipo = localStorage.getItem("usuario_tipo");
      if (tipo === "Admin") {
        window.location.href = "/perfil_admin.html";
      }

      const nome = localStorage.getItem("usuario_nome");
      document.getElementById("usuario").value = nome;
    });
  </script>
</body>
</html>
