<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Novo Usuário - Sistema Modular</title>

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

    <style>
        body {
            background-color: #f1f3f4;
        }

        .sidebar {
            height: 100vh;
            background: linear-gradient(180deg, #212529, #343a40);
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            padding-top: 60px;
        }

        .sidebar a {
            color: #adb5bd;
            text-decoration: none;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background-color: #495057;
            color: white;
        }

        .sidebar i {
            margin-right: 10px;
        }

        .content {
            margin-left: 250px;
            padding: 2rem;
        }

        .topbar {
            position: fixed;
            top: 0;
            left: 250px;
            right: 0;
            height: 60px;
            background-color: #ffffff;
            border-bottom: 1px solid #dee2e6;
            z-index: 1000;
            padding: 0 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .topbar h5 {
            margin: 0;
        }

        .username-btn {
            font-size: 0.9rem;
        }

        .form-container {
            background: #fff;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 700px;
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <a href="/painel"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="#"><i class="bi bi-folder2-open"></i> Documentos</a>
        <a href="#"><i class="bi bi-tools"></i> Manutenção</a>
        <a href="/controle_usuarios"><i class="bi bi-people"></i> Usuários</a>
        <a href="#"><i class="bi bi-gear"></i> Configurações</a>
        <a href="#"><i class="bi bi-bar-chart-line"></i> Relatórios</a>
    </div>

    <!-- Topbar -->
    <div class="topbar">
        <h5>Novo Usuário</h5>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-primary username-btn">
                <i class="bi bi-person-circle"></i> Carregando...
            </button>
            <button onclick="logout()" class="btn btn-outline-danger btn-sm">Sair</button>
        </div>
    </div>

    <!-- Conteúdo -->
    <div class="content mt-5">
        <h3 class="mb-4 text-center">Cadastro de Novo Usuário</h3>
        <div class="form-container">
            <form id="formNovoUsuario">
                <div class="mb-3">
                    <label for="nomeUsuario" class="form-label">Nome de Usuário</label>
                    <input type="text" class="form-control" id="nomeUsuario" required>
                </div>

                <div class="mb-3">
                    <label for="emailUsuario" class="form-label">Email</label>
                    <input type="email" class="form-control" id="emailUsuario" required>
                </div>

                <div class="mb-3">
                    <label for="senhaUsuario" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="senhaUsuario" required>
                </div>
<!-- 
                <div class="mb-3">
                    <label for="grupoUsuario" class="form-label">Grupo</label>
                    <select class="form-select" id="grupoUsuario">
                        <option value="Admin">Administrador</option>
                        <option value="Comum">Comum</option>
                        <option value="leitor">Leitor</option>
                    </select>
                </div> -->

                <div class="mb-3">
                    <label for="tipoUsuario" class="form-label">Tipo de Conta</label>
                    <select class="form-select" id="tipoUsuario">
                        <option value="Comum">Comum</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>

                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" id="ativoUsuario" checked>
                    <label class="form-check-label" for="ativoUsuario">Ativo</label>
                </div>

                <button type="submit" class="btn btn-success">
                    <i class="bi bi-check-circle"></i> Criar Usuário
                </button>
                <a href="/controle_usuarios" class="btn btn-secondary ms-2">Cancelar</a>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const nomeUsuario = localStorage.getItem("usuario_nome") || "Usuário";
            const token = localStorage.getItem("token");

            if (!token) {
                window.location.href = "/";
                return;
            }

            const btnUsuario = document.querySelector(".username-btn");
            if (btnUsuario) {
                btnUsuario.innerHTML = `<i class="bi bi-person-circle"></i> ${nomeUsuario}`;
            }
        });

        function logout() {
            localStorage.clear();
            window.location.href = "/";
        }

        document.getElementById("formNovoUsuario").addEventListener("submit", async (e) => {
            e.preventDefault();

            const novoUsuario = {
                email: document.getElementById("emailUsuario").value,
                password: document.getElementById("senhaUsuario").value,
                usuario: document.getElementById("nomeUsuario").value,
                // grupo: document.getElementById("grupoUsuario").value,
                tipo: document.getElementById("tipoUsuario").value,
                criado_por_id: localStorage.getItem("usuario_id"), // ID do usuário que está criando o novo usuário
                // Se o checkbox estiver marcado, ativo será true, caso contrário será false
                ativo: document.getElementById("ativoUsuario").checked
            };

            try {
                const token = localStorage.getItem("token");
                const response = await fetch("http://localhost:3000/api/autenticacao/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        Authorization: `Bearer ${token}`
                    },
                    body: JSON.stringify(novoUsuario)
                });

                if (!response.ok) throw new Error("Erro ao criar usuário");

                alert("Usuário criado com sucesso!");
                window.location.href = "/controle_usuarios";
            } catch (err) {
                console.error(err);
                alert("Erro ao criar usuário.");
            }
        });
    </script>
</body>

</html>
