<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Simples</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f5f5f5;
    }

    .login-container {
      max-width: 400px;
      margin: 80px auto;
      padding: 30px;
      background-color: white;
      border-radius: 12px;
      box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="login-container">
      <h2 class="text-center mb-4">Acessar Sistema</h2>
      <form id="login-form">
        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" class="form-control" id="email" placeholder="seu@email.com" required />
        </div>
        <div class="mb-3">
          <label for="senha" class="form-label">Senha</label>
          <input type="password" class="form-control" id="senha" placeholder="Digite sua senha" required />
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary">Entrar</button>
        </div>
        <p class="text-center mt-3">
          <a href="/esqueci-senha">Esqueceu a senha?</a>
        </p>
      </form>
      <p id="mensagem" class="mt-3 text-center text-danger"></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document
      .getElementById("login-form")
      .addEventListener("submit", async function (e) {
        e.preventDefault(); // Impede o form de recarregar a página

        const email = document.getElementById("email").value;
        const senha = document.getElementById("senha").value;

        try {
          const resposta = await fetch(
            "/api/autenticacao/login",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ email, password: senha }),
            }
          );

          const dados = await resposta.json();

          if (resposta.ok && dados.success) {
            document.getElementById(
              "mensagem"
            ).textContent = `Bem-vindo, ${dados.usuario.usuario}!`;
            // Exemplo: salvar token no localStorage
            localStorage.setItem("token", dados.token);
            localStorage.setItem("usuario_nome", dados.usuario.usuario);
            localStorage.setItem("usuario_id", dados.usuario.id);
            localStorage.setItem("usuario_email", dados.usuario.email);
            localStorage.setItem("usuario_tipo", dados.usuario.tipo);
            // Redirecionar para o painel, por exemplo
            window.location.href = "/painel";
          } else {
            document.getElementById("mensagem").textContent =
              "Email ou senha inválidos.";
          }
        } catch (erro) {
          console.error("Erro na requisição:", erro);
          document.getElementById("mensagem").textContent =
            "Erro ao conectar com o servidor.";
        }
      });
  </script>
</body>

</html>
