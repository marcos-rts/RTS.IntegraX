<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RTS IntegraX</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/login.css" rel="stylesheet" />
</head>

<body>
  <form class="form-signin" id="login-form">
    <div class="text-center mb-4">
      <img class="mb-4" src="img/logo.png" alt="" width="150" height="150">
      <!-- <h1 class="h3 mb-3 font-weight-normal">RTS IntegraX</h1> -->
    </div>

    <div class="form-label-group">
      <input type="email" id="email" class="form-control" placeholder="Endereço de email" required autofocus>
      <label for="email">Endereço de email</label>
    </div>

    <div class="form-label-group">
      <input type="password" id="senha" class="form-control" placeholder="Senha" required>
      <label for="senha">Senha</label>
    </div>

    <div class="checkbox mb-3">
      <label>
        <input type="checkbox" value="lembrar de mim"> Lembrar de mim
      </label>
      <p class="text-center mt-3">
        <a href="/esqueci-senha">Esqueceu a senha?</a>
      </p>
    </div>
    <div id="mensagem" class="alert alert-danger text-center" style="display: none;"></div>
    <button class="btn btn-lg btn-primary btn-block" type="submit">Entrar</button>
    <p class="mt-5 mb-3 text-muted text-center">&copy; 2024-2025</p>
  </form>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/login.js"></script>
</body>

</html>
