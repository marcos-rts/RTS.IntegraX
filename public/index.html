<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RTS IntegraX</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    :root {
      --input-padding-x: .75rem;
      --input-padding-y: .75rem;
    }

    html,
    body {
      height: 100%;
    }

    body {
      display: -ms-flexbox;
      display: flex;
      -ms-flex-align: center;
      align-items: center;
      padding-top: 40px;
      padding-bottom: 40px;
      background-color: #f5f5f5;
    }

    .form-signin {
      width: 100%;
      max-width: 420px;
      padding: 15px;
      margin: auto;
    }

    .form-label-group {
      position: relative;
      margin-bottom: 1rem;
    }

    .form-label-group>input,
    .form-label-group>label {
      padding: var(--input-padding-y) var(--input-padding-x);
    }

    .form-label-group>label {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      width: 100%;
      margin-bottom: 0;
      /* Sobrescreve a margem padrão da <label> */
      line-height: 1.5;
      color: #495057;
      cursor: text;
      /* Match the input under the label */
      border: 1px solid transparent;
      border-radius: .25rem;
      transition: all .1s ease-in-out;
    }

    .form-label-group input::-webkit-input-placeholder {
      color: transparent;
    }

    .form-label-group input:-ms-input-placeholder {
      color: transparent;
    }

    .form-label-group input::-ms-input-placeholder {
      color: transparent;
    }

    .form-label-group input::-moz-placeholder {
      color: transparent;
    }

    .form-label-group input::placeholder {
      color: transparent;
    }

    .form-label-group input:not(:placeholder-shown) {
      padding-top: calc(var(--input-padding-y) + var(--input-padding-y) * (2 / 3));
      padding-bottom: calc(var(--input-padding-y) / 3);
    }

    .form-label-group input:not(:placeholder-shown)~label {
      padding-top: calc(var(--input-padding-y) / 3);
      padding-bottom: calc(var(--input-padding-y) / 3);
      font-size: 12px;
      color: #777;
    }

    /* Fallback for Edge
-------------------------------------------------- */
    @supports (-ms-ime-align: auto) {
      .form-label-group>label {
        display: none;
      }

      .form-label-group input::-ms-input-placeholder {
        color: #777;
      }
    }

    /* Fallback for IE
-------------------------------------------------- */
    @media all and (-ms-high-contrast: none),
    (-ms-high-contrast: active) {
      .form-label-group>label {
        display: none;
      }

      .form-label-group input:-ms-input-placeholder {
        color: #777;
      }
    }
  </style>
</head>

<body>
  <form class="form-signin" id="login-form">
    <div class="text-center mb-4">
      <img class="mb-4" src="img/logo.png" alt="" width="72" height="72">
      <h1 class="h3 mb-3 font-weight-normal">RTS IntegraX</h1>
    </div>

    <div class="form-label-group">
      <input type="email" id="email" class="form-control" placeholder="Endereço de email" required autofocus>
      <label for="email">Endereço de email</label>
    </div>

    <div class="form-label-group">
      <input type="password" id="senha" class="form-control" placeholder="Senha" required>
      <label for="senha">Senha</label>
    </div>

    <div class="checkbox mb-3">
      <label>
        <input type="checkbox" value="lembrar de mim"> Lembrar de mim
      </label>
      <p class="text-center mt-3">
        <a href="/esqueci-senha">Esqueceu a senha?</a>
      </p>
    </div>
    <button class="btn btn-lg btn-primary btn-block" type="submit">Entrar</button>
    <p class="mt-5 mb-3 text-muted text-center">&copy; 2024-2025</p>
  </form>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document
      .getElementById("login-form")
      .addEventListener("submit", async function (e) {
        e.preventDefault(); // Impede o form de recarregar a página

        const email = document.getElementById("email").value;
        const senha = document.getElementById("senha").value;

        try {
          const resposta = await fetch(
            "/api/autenticacao/login",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ email, password: senha }),
            }
          );

          const dados = await resposta.json();

          if (resposta.ok && dados.success) {
            document.getElementById(
              "mensagem"
            ).textContent = Bem - vindo, ${ dados.usuario.usuario } !;
            // Exemplo: salvar token no localStorage
            localStorage.setItem("token", dados.token);
            localStorage.setItem("usuario_nome", dados.usuario.usuario);
            localStorage.setItem("usuario_id", dados.usuario.id);
            localStorage.setItem("usuario_email", dados.usuario.email);
            localStorage.setItem("usuario_tipo", dados.usuario.tipo);
            // Redirecionar para o painel, por exemplo
            window.location.href = "/painel";
          } else {
            document.getElementById("mensagem").textContent =
              "Email ou senha inválidos.";
          }
        } catch (erro) {
          console.error("Erro na requisição:", erro);
          document.getElementById("mensagem").textContent =
            "Erro ao conectar com o servidor.";
        }
      });
  </script>
</body>

</html>
