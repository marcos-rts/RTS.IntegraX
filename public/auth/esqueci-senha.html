<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Esqueci minha senha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background-color: #f5f5f5;
        }

        .reset-container {
            max-width: 400px;
            margin: 80px auto;
            padding: 30px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="reset-container">
            <h2 class="text-center mb-4">Recuperar Senha</h2>
            <p class="text-center mb-3 text-muted">
                Informe seu e-mail para receber instruções de redefinição.
            </p>
            <form id="reset-form">
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" placeholder="seu@email.com" required />
                </div>
                <div class="mb-3">
                    <label for="nova-senha" class="form-label">Nova Senha</label>
                    <input type="password" class="form-control" id="nova-senha" placeholder="Digite sua nova senha"
                        required />
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">
                        Enviar Instruções
                    </button>
                </div>
                <p class="text-center mt-3">
                    <a href="/">Voltar ao login</a>
                </p>
            </form>
            <p id="mensagem" class="mt-3 text-center"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document
            .getElementById("reset-form")
            .addEventListener("submit", async function (e) {
                e.preventDefault();

                const email = document.getElementById("email").value;
                const newpassword = document.getElementById("nova-senha").value;
                const mensagem = document.getElementById("mensagem");

                try {
                    const resposta = await fetch("/api/autenticacao/reset_senha_admin", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({ email, newpassword }),
                    });

                    const dados = await resposta.json();

                    if (resposta.ok && dados.success) {
                        mensagem.textContent = "Senha resetada com sucesso.";
                        mensagem.classList.remove("text-danger");
                        mensagem.classList.add("text-success");
                    } else {
                        mensagem.textContent = dados.message || "Erro ao tentar recuperar a senha.";
                        mensagem.classList.remove("text-success");
                        mensagem.classList.add("text-danger");
                    }
                } catch (erro) {
                    console.error("Erro na requisição:", erro);
                    mensagem.textContent = "Erro ao conectar com o servidor.";
                    mensagem.classList.remove("text-success");
                    mensagem.classList.add("text-danger");
                }
            });
    </script>
</body>

</html>
